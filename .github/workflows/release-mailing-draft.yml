name: Release mailing list draft

# Daily check for new tool releases across the LEAPP repos (iLEAPP, ALEAPP,
# RLEAPP, VLEAPP, LAVA, Batch LEAPP). If any were published in the lookback
# window, creates ONE Mailjet campaign draft digesting them all — same-day
# releases become a single email. The draft is NOT sent; review and send it
# from the Mailjet dashboard (Campaigns → Drafts).
#
# Uses the same repo configuration as blog-mailing-draft.yml:
#   Secrets:   MAILJET_API_KEY, MAILJET_API_SECRET
#   Variables: MAILJET_LIST_ID, MAILJET_SENDER_EMAIL, MAILJET_SENDER_NAME
# Optional:    ANTHROPIC_API_KEY secret — generates the email intro in
#              Alexis's voice via the Claude API; without it (or on any API
#              failure) the draft gets a static intro instead.

on:
  schedule:
    # Daily at 05:00 UTC, after the publishing day has ended in the
    # maintainers' timezone, so every release of a given day lands in the
    # same run and same digest. Running mid-day (the old 13:30 UTC) split
    # release days in two: anything published after the cron fell into the
    # next day's window while that morning's releases had already aged out.
    #
    # The lookback has to cover the gap between two consecutive runs, and
    # GitHub delays this cron by anywhere from 24 minutes to 12 hours. Over
    # 35 scheduled runs the gap reached 34.6h and exceeded 25h four times,
    # so a window sized just over a day leaves blind spots between runs.
    # 36h covers the largest observed gap. The cost is that a release can
    # appear in two consecutive drafts, which is the right trade: drafts are
    # reviewed before sending, so a duplicate draft is deleted in a click
    # while a missed release is never drafted at all.
    - cron: '0 5 * * *'
  # Manual run. Two modes:
  #   window   the same thing the schedule does, over the hours given below.
  #            A wider window (720 = last 30 days) gets a draft without
  #            waiting for a fresh release.
  #   current  the newest release of every tool whatever its age, for a
  #            "where the suite stands" mailer. Use this when tools shipped
  #            days apart and no single window can hold them all. 'hours' is
  #            ignored in this mode.
  # Still draft-only in both.
  workflow_dispatch:
    inputs:
      mode:
        description: 'Which digest to build'
        required: true
        type: choice
        default: 'window'
        options:
          - window
          - current
      hours:
        description: 'Lookback window in hours (window mode only)'
        required: true
        default: '36'

permissions:
  contents: read

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Anthropic SDK for intro generation
        run: pip install anthropic

      - name: Create release digest draft
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MAILJET_API_KEY: ${{ secrets.MAILJET_API_KEY }}
          MAILJET_API_SECRET: ${{ secrets.MAILJET_API_SECRET }}
          MAILJET_LIST_ID: ${{ vars.MAILJET_LIST_ID }}
          MAILJET_SENDER_EMAIL: ${{ vars.MAILJET_SENDER_EMAIL }}
          MAILJET_SENDER_NAME: ${{ vars.MAILJET_SENDER_NAME }}
        run: |
          # A scheduled run has no inputs, so it falls through to window mode.
          if [ "${{ inputs.mode }}" = "current" ]; then
            python3 scripts/create_release_digest_draft.py --current
          else
            python3 scripts/create_release_digest_draft.py --hours "${{ inputs.hours || 36 }}"
          fi
