name: Generate Blog Index

on:
  push:
    branches:
      - main
    paths:
      - 'blog/posts/*.md'
      - 'scripts/generate_blog_index.py'
      - '.github/workflows/generate-blog-index.yml'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: generate-blog-index
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Pull latest
        run: git pull --rebase origin main

      - name: Generate blog index
        run: python3 scripts/generate_blog_index.py

      - name: Commit generated index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add blog/posts/index.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: generate blog index"
            git fetch origin main
            git rebase origin/main
            git push origin main
          fi
